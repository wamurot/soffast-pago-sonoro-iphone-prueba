name: SoffastPagoPrueba
options:
  bundleIdPrefix: com.soffast
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  SoffastPagoPrueba:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soffast.pago.prueba
        CODE_SIGN_STYLE: Automatic

schemes:
  SoffastPagoPrueba:
    build:
      targets:
        SoffastPagoPrueba: all

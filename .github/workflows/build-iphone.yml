name: Compilar Soffast Pago Nativo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar
        run: |
          xcodebuild \
            -project SoffastPago.xcodeproj \
            -scheme SoffastPago \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SoffastPago.app Payload/
          zip -qry Soffast_Pago_Nativo_V2_UNSIGNED.ipa Payload

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Soffast-Pago-Nativo-V2
          path: Soffast_Pago_Nativo_V2_UNSIGNED.ipa
          retention-days: 7

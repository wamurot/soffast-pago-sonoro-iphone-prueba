name: Compilar SofPago iPhone Audio Multimedia

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar sin firma
        run: |
          xcodebuild \
            -project SoffastPagoPrueba.xcodeproj \
            -scheme SoffastPagoPrueba \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SoffastPagoPrueba.app Payload/
          zip -qry SofPago_iPhone_AUDIO_MULTIMEDIA_BLOQUEADO_V3_UNSIGNED.ipa Payload

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: SofPago-iPhone-AUDIO-MULTIMEDIA-BLOQUEADO-V3
          path: SofPago_iPhone_AUDIO_MULTIMEDIA_BLOQUEADO_V3_UNSIGNED.ipa
          retention-days: 7

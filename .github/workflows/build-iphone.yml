name: Compilar Prueba Unica iPhone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar sin firma
        run: |
          xcodebuild \
            -project SoffastPagoPrueba.xcodeproj \
            -scheme SoffastPagoPrueba \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SoffastPagoPrueba.app Payload/
          zip -qry Soffast_Pago_iPhone_PRUEBA_UNICA_UNSIGNED.ipa Payload

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Soffast-Pago-iPhone-PRUEBA-UNICA
          path: Soffast_Pago_iPhone_PRUEBA_UNICA_UNSIGNED.ipa
          retention-days: 7

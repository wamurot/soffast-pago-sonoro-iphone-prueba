name: Compilar SofPago iPhone Audio Multimedia

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar sin firma Apple
        run: |
          xcodebuild \
            -project SoffastPagoPrueba.xcodeproj \
            -scheme SoffastPagoPrueba \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Incrustar entitlement APNs para que Sideloadly lo intente preservar
        run: |
          APP="build/Build/Products/Release-iphoneos/SoffastPagoPrueba.app"
          /usr/bin/codesign --force --sign - --entitlements App/SofPagoPushProbe.entitlements "$APP"
          echo "=== ENTITLEMENTS AD-HOC ==="
          /usr/bin/codesign -d --entitlements :- "$APP" || true

      - name: Crear IPA V5
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SoffastPagoPrueba.app Payload/
          zip -qry SofPago_iPhone_APNS_PRUEBA_V5_UNSIGNED.ipa Payload

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: SofPago-iPhone-APNS-PRUEBA-V5
          path: SofPago_iPhone_APNS_PRUEBA_V5_UNSIGNED.ipa
          retention-days: 7
